# Contrato de datos: Tracking de envíos
# Coincide con src/electrocasa/transformations/silver/silver_resenas_tracking.py
# y REGLAS["tracking"] de utils/calidad.py.
# No contiene host, usuario ni contraseña: solo el nombre de la Connection.

fuente: tracking_envios
version: 1
ultima_actualizacion: "2026-11-22"
responsable: "courier externo, a través de logística de ElectroCasa"
llegada: "Azure SQL Database, tabla dbo.TrackingEnvios"
metodo_ingesta: "Conector query-based de SQL Server (Lakeflow Connect)"
connection_unity_catalog: "conn_electrocasa_tracking"
cursor: fecha_modificacion
modo_historia: >-
  SCD Type 1 con llave evento_id. Cada evento es único e inmutable (un cambio de estado),
  así que SCD1 equivale a guardar todos los eventos, y además hace la carga idempotente:
  si el conector vuelve a leer un evento, el MERGE por evento_id lo sobrescribe en vez de
  duplicarlo. Los mensajes reprocesados (mismo cambio con OTRO evento_id) se resuelven en Silver.
frecuencia_esperada: "en cada corrida del job; la tabla ya está completa desde el inicio del proyecto (15.139 eventos)"
tabla_bronze: "<catalogo>.bronze.tracking_envios"
tabla_silver: "<catalogo>.silver.tracking_envios"
llave: evento_id
depende_de:
  - fuente: ventas
    columna: venta_id

columnas:
  - nombre: evento_id
    tipo: bigint
    nulo: false
  - nombre: tracking_id
    tipo: string
    nulo: false
  - nombre: venta_id
    tipo: string
    nulo: true
    regla: >-
      Si la venta no existe en silver.ventas el evento SE CONSERVA con venta_en_ventas = false
      y una advertencia: el envío existió y cuenta en las métricas del courier (pregunta 6),
      que no dependen de la venta.
  - nombre: courier
    tipo: string
    nulo: false
    regla: "initcap después de minúsculas y espacios unificados"
  - nombre: estado_entrega
    tipo: string
    nulo: false
    valores_permitidos: ["pendiente", "en_transito", "entregado", "devuelto"]
  - nombre: sucursal_origen
    tipo: string
    nulo: true
  - nombre: fecha_actualizacion
    tipo: date
    nulo: true
  - nombre: fecha_modificacion
    tipo: timestamp
    nulo: false
  - nombre: venta_en_ventas
    tipo: boolean
    nulo: false

reglas_de_calidad:
  - nombre: estado_conocido
    condicion: "estado_entrega IN ('pendiente', 'en_transito', 'entregado', 'devuelto')"
    politica: drop
    destino_rechazos: "silver.cuarentena (fuente = 'tracking', politica = 'drop')"
    justificacion: >-
      Las métricas de la pregunta 6 dependen del estado. Un estado que no está en el mapa
      no se puede clasificar; queda en cuarentena con su valor original (registro) para
      agregarlo al mapa ESTADOS_ENTREGA.
  - nombre: tracking_id_informado
    condicion: "tracking_id IS NOT NULL"
    politica: drop
    destino_rechazos: "silver.cuarentena"
    justificacion: "Las métricas se calculan por envío."
  - nombre: fecha_modificacion_informada
    condicion: "fecha_modificacion IS NOT NULL"
    politica: drop
    destino_rechazos: "silver.cuarentena"
    justificacion: "Es la columna con la que se miden las horas de entrega."
  - nombre: venta_existe
    condicion: "venta_en_ventas"
    politica: warn
    destino_rechazos: "silver.cuarentena (politica = 'warn')"
    justificacion: "El envío existió; la métrica del courier no necesita la venta."
  - nombre: courier_informado
    condicion: "courier IS NOT NULL"
    politica: warn
    destino_rechazos: "silver.cuarentena (politica = 'warn')"
    justificacion: "Sin courier el envío queda en un grupo NULL en la pregunta 6."

transformaciones_silver:
  - "estado_entrega: minúsculas, sin tildes, '_' y espacios unificados y mapa a 4 estados ('En camino', 'EN_CAMINO', 'en_transito' -> en_transito)"
  - "courier: initcap(minúsculas y espacios unificados)"
  - "mensaje reprocesado = mismo tracking_id con el mismo estado estandarizado y otro evento_id: se conserva el de menor fecha_modificacion"
  - "left join con silver.ventas para marcar venta_en_ventas"

problemas_conocidos:
  - problema: "estado_entrega con valores y casing inconsistentes"
    ejemplo: "'En camino', 'EN_CAMINO', 'en_transito'"
    filas_afectadas: "completar con SELECT estado_entrega, count(*) FROM bronze.tracking_envios GROUP BY 1"
    tratamiento: "mapa ESTADOS_ENTREGA"
  - problema: "courier con casing inconsistente"
    ejemplo: "completar con SELECT DISTINCT courier FROM bronze.tracking_envios"
    filas_afectadas: "completar"
    tratamiento: "initcap"
  - problema: "mensajes reprocesados (mismo cambio de estado con distinto evento_id)"
    ejemplo: "completar con un tracking_id real"
    filas_afectadas: "completar con la consulta de la sección 'Exploración de Tracking' del README"
    tratamiento: "deduplicación por (tracking_id, estado_entrega)"
  - problema: "fecha_actualizacion nula"
    ejemplo: "fecha_actualizacion = NULL"
    filas_afectadas: "completar"
    tratamiento: "no se usa: las horas se miden con fecha_modificacion, que nunca es nula"
  - problema: "venta_id que no existe en ventas"
    ejemplo: "completar"
    filas_afectadas: "completar (silver.cuarentena, fuente = 'tracking', regla venta_existe)"
    tratamiento: "regla venta_existe (warn)"
